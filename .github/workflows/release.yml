name: Release
run-name: Release · ${{ github.ref_name }}

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish after verification (must run against a version tag)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  QT_VERSION: 6.8.3
  CMAKE_BUILD_PARALLEL_LEVEL: 2

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate release version
        id: version
        env:
          PUBLISH_REQUESTED: ${{ github.event_name == 'push' || inputs.publish }}
        run: python3 scripts/release_version.py

  build-linux:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      TNUXMUSIC_TEST_ARTIFACTS: ${{ github.workspace }}/test-artifacts/screenshots
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build libssl-dev dpkg-dev file \
            libgl1 libegl1 libpulse0 libva-x11-2 libva-drm2 fonts-noto-cjk
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: linux
          target: desktop
          arch: linux_gcc_64
          modules: qtmultimedia
          cache: true
      - name: Configure
        run: >-
          cmake -S . -B build/ci -G Ninja
          -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
          -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR"
      - name: Build
        run: cmake --build build/ci --config Release
      - name: Test
        run: ctest --test-dir build/ci --output-on-failure --timeout 120 --output-junit test-results.xml
      - name: Package DEB
        run: bash scripts/package_linux_deb.sh build/ci "$QT_ROOT_DIR" "$RELEASE_TAG"
      - name: Verify packaged runtime
        run: |
          dpkg-deb --info "dist/tnuxmusic-$RELEASE_TAG-linux-amd64.deb"
          dpkg-deb --extract "dist/tnuxmusic-$RELEASE_TAG-linux-amd64.deb" build/package-check
          python3 tests/cli_regression.py "$PWD/build/package-check/opt/tnuxmusic/bin/tnuxmusic"
      - name: Upload Linux package
        uses: actions/upload-artifact@v4
        with:
          name: package-linux
          path: dist/*.deb
          if-no-files-found: error
      - name: Preserve test logs and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostics-linux
          path: |
            build/ci/Testing/Temporary/
            build/ci/test-results.xml
            test-artifacts/
          if-no-files-found: ignore
          retention-days: 14

  build-windows:
    needs: prepare
    runs-on: windows-2022
    timeout-minutes: 40
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/.vcpkg-cache
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: qtmultimedia
          cache: true
      - name: Prepare dependency cache
        id: vcpkg
        run: |
          New-Item -ItemType Directory -Force $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null
          $revision = git -C $env:VCPKG_INSTALLATION_ROOT rev-parse HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Cannot identify vcpkg revision' }
          "revision=$revision" >> $env:GITHUB_OUTPUT
      - uses: actions/cache@v4
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: vcpkg-windows-2022-x64-${{ steps.vcpkg.outputs.revision }}-openssl
      - name: Install packaging dependencies
        run: |
          choco install ninja innosetup -y --no-progress
          if ($LASTEXITCODE -notin @(0, 3010)) { throw 'Chocolatey installation failed' }
          & "$env:VCPKG_INSTALLATION_ROOT/vcpkg.exe" install openssl:x64-windows
          if ($LASTEXITCODE -ne 0) { throw 'OpenSSL installation failed' }
      - name: Configure
        run: |
          cmake -S . -B build/ci -G Ninja `
            -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF `
            "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows "-DCMAKE_PREFIX_PATH=$env:QT_ROOT_DIR"
          if ($LASTEXITCODE -ne 0) { throw 'CMake configuration failed' }
      - name: Build
        run: cmake --build build/ci --config Release
      - name: Package and verify Windows runtime
        run: >-
          ./scripts/package_windows.ps1 -BuildDir build/ci -QtRoot $env:QT_ROOT_DIR
          -VcpkgRoot $env:VCPKG_INSTALLATION_ROOT -Version $env:RELEASE_VERSION -Tag $env:RELEASE_TAG
      - name: Upload Windows packages
        uses: actions/upload-artifact@v4
        with:
          name: package-windows
          path: |
            dist/*.zip
            dist/*.exe
          if-no-files-found: error
      - name: Preserve configure diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostics-windows
          path: build/ci/CMakeFiles/CMakeConfigureLog.yaml
          if-no-files-found: ignore
          retention-days: 14

  release:
    if: needs.prepare.outputs.publish == 'true'
    needs: [prepare, build-linux, build-windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Download verified packages
        uses: actions/download-artifact@v4
        with:
          pattern: package-*
          path: release-assets
          merge-multiple: true
      - name: Validate assets and write checksums
        working-directory: release-assets
        run: |
          test -s "tnuxmusic-$RELEASE_TAG-linux-amd64.deb"
          test -s "tnuxmusic-$RELEASE_TAG-windows-x64.zip"
          test -s "tnuxmusic-$RELEASE_TAG-windows-x64-setup.exe"
          sha256sum -- *.deb *.zip *.exe > SHA256SUMS.txt
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: tnuxmusic ${{ needs.prepare.outputs.tag }}
          files: release-assets/*
          fail_on_unmatched_files: true
          body_path: docs/RELEASE_NOTES.md
          generate_release_notes: true
